name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci 대신 install: 로컬/CI npm 버전 차이로 인한 lock 불일치 허용
      - run: npm install
      # 단일 빌드 — 로케일(=모국어)에 따라 코스가 런타임 전환된다
      #   https://h2techjun.github.io/vibe-english/
      #   /ko = 영어 학습, /en·/zh = 한국어 학습
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /vibe-english
      - run: mv out site
      # 구 Loopla Korean 별도 빌드 URL(/korean)은 /en 로케일로 리다이렉트 (링크 보존)
      - run: |
          mkdir -p site/korean
          cat > site/korean/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/vibe-english/en/"><link rel="canonical" href="https://h2techjun.github.io/vibe-english/en/"><title>Loopla</title>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
